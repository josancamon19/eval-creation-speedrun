schema_version = "1.4"
artifacts = [
    { source = "/workspace/Nim/compiler", destination = "compiler", exclude = [
        ".git",
        ".cache",
        ".venv",
        "__pycache__",
        "nimcache",
        "node_modules",
        "nim",
        "nim.exe",
        "*.o",
        "*.obj",
    ] },
    { source = "/workspace/Nim/lib", destination = "lib", exclude = [
        ".git",
        ".cache",
        ".venv",
        "__pycache__",
        "nimcache",
        "node_modules",
        "*.o",
        "*.obj",
    ] },
]

[metadata]
pr = @PR_NUMBER@
issue = @ISSUE_NUMBER@
name = "@TASK_NAME@"
category = "compiler"
tags = ["nim", "regression", "issue-linked"]
base_commit = "@BASE_COMMIT@"
merge_commit = "@MERGE_COMMIT@"
target_os = "linux"
target_arch = "amd64"
backend = "c"

[agent]
timeout_sec = 3600
user = "agent"
network_mode = "allowlist"
allowed_hosts = ["api.fireworks.ai"]

[verifier]
environment_mode = "separate"
timeout_sec = 1200
user = "root"
network_mode = "no-network"

[environment]
build_timeout_sec = 1800
cpus = 4
memory_mb = 8192
storage_mb = 16384
workdir = "/workspace/Nim"
network_mode = "no-network"
