# One independent fresh Daytona sandbox per task and attempt.
n_attempts: 1
n_concurrent_trials: 16
jobs_dir: jobs
retry:
  max_retries: 0

environment:
  type: daytona
  delete: true
  kwargs:
    # Declarative images retain Daytona's 24-hour cache without snapshot quotas.
    auto_snapshot: false

agents:
  - name: mini-swe-agent
    model_name: fireworks_ai/accounts/fireworks/models/deepseek-v4p1-flash-1017
    override_timeout_sec: 7200
    kwargs:
      version: "2.4.6"
      skip_install: true
      cost_limit: "0"
      # do not add a config here
  # - name: mini-swe-agent
  #   model_name: openai/nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16:peft:262144
  #   base_url: https://tinker.thinkingmachines.dev/services/tinker-prod/oai/api/v1
  #   model_api_key_name: TINKER_API_KEY
  #   extra_allowed_hosts:
  #     - tinker.thinkingmachines.dev
  #   kwargs:
  #     version: "2.4.6"
  #     skip_install: true
  #     cost_limit: "0"

datasets:
  - path: datasets/nim
