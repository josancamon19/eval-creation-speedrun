[project]
name = "generator"
version = "0.1.0"
description = "Reproducible Nim regression tasks for Harbor and mini-swe-agent"
readme = "README.md"
authors = [
    { name = "Joan Cabezas", email = "joan.santiago.cabezas@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "harbor[daytona]==0.25.0",
    "mini-swe-agent==2.4.6",
    "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8,<10",
    "ruff>=0.17.3",
    "ty>=0.0.97",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["repos", "datasets", ".cache"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty.src]
include = ["src", "checks", "tests"]

[tool.ty.environment]
extra-paths = ["checks"]

[tool.uv.sources]
harbor = { git = "https://github.com/harbor-framework/harbor.git", rev = "b7cc86b617eb5a220c3d6041dbcca4fda8a6f5a8" }

[project.scripts]
generator = "generator:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
